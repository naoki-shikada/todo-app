services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-todo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo_password}
      POSTGRES_DB: ${DB_NAME:-todo_app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - todo_db_data:/var/lib/postgresql/data

volumes:
  todo_db_data:
