<meta charset="UTF-8">
<title>TODOアプリ</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 480px;
    margin: 40px auto;
    background: #f5f5f5;
    color: #333;
  }
  h1 {
    text-align: center;
  }
  #todo-form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #todo-title {
    flex: 1;
    padding: 8px;
    font-size: 14px;
  }
  #todo-form button {
    padding: 8px 16px;
    cursor: pointer;
  }
  #search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #todo-list {
    list-style: none;
    padding: 0;
  }
  #todo-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }
  #todo-list li span {
    flex: 1;
  }
  #todo-list li.completed span {
    text-decoration: line-through;
    color: #999;
  }
  #todo-list li button {
    cursor: pointer;
    color: #c0392b;
  }
</style>

<h1>TODOアプリ</h1>

<!-- TODO検索 -->
<input type="text" id="search-input" placeholder="検索（あいまい一致）">

<!-- TODO追加フォーム -->
<form id="todo-form">
  <input type="text" id="todo-title" placeholder="やることを入力" required>
  <button type="submit">追加</button>
</form>

<!-- TODO一覧 -->
<ul id="todo-list"></ul>

<script>
  const form = document.getElementById('todo-form');
  const titleInput = document.getElementById('todo-title');
  const list = document.getElementById('todo-list');
  const searchInput = document.getElementById('search-input');

  // サーバーからTODO一覧を取得して画面に描画する（検索欄に入力があれば絞り込む）
  async function fetchTodos() {
    const search = searchInput.value.trim();
    const query = search ? `?search=${encodeURIComponent(search)}` : '';
    const res = await fetch(`/todos${query}`);
    const todos = await res.json();
    renderTodos(todos);
  }

  // TODO一覧をDOMに反映する
  function renderTodos(todos) {
    list.innerHTML = '';
    todos.forEach((todo) => {
      const li = document.createElement('li');
      if (todo.completed) li.classList.add('completed');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.completed;
      checkbox.addEventListener('change', () => toggleCompleted(todo.id, checkbox.checked));

      const span = document.createElement('span');
      span.textContent = todo.title;

      const deleteButton = document.createElement('button');
      deleteButton.textContent = '削除';
      deleteButton.addEventListener('click', () => deleteTodo(todo.id));

      li.append(checkbox, span, deleteButton);
      list.appendChild(li);
    });
  }

  // 新しいTODOを追加する（新しく設定したい値=titleがあるのでbodyが必要）
  async function addTodo(title) {
    await fetch('/todos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title }),
    });
    await fetchTodos();
  }

  // 完了/未完了を切り替える（新しく設定したい値=completedがあるのでbodyが必要）
  async function toggleCompleted(id, completed) {
    await fetch(`/todos/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ completed }),
    });
    await fetchTodos();
  }

  // TODOを削除する（新しく設定したい値が無いのでbodyは不要。対象はURLのidだけで指定できる）
  async function deleteTodo(id) {
    await fetch(`/todos/${id}`, { method: 'DELETE' });
    await fetchTodos();
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const title = titleInput.value.trim();
    if (!title) return;
    addTodo(title);
    titleInput.value = '';
  });

  // 入力するたびに検索を実行する（1文字入力した時点で絞り込みが反映される）
  searchInput.addEventListener('input', () => {
    fetchTodos();
  });

  fetchTodos();
</script>
